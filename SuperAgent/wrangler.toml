name = "super-axevora"
main = "src/index.mjs"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"

# Cloudflare D1 Database binding for persistent memory (optional, enabled when configured)
# [[d1_databases]]
# binding = "DB"
# database_name = "superagent_memory"
# database_id = "your-database-id"

[vars]
# Non-secret environment variables (secrets must be set via wrangler secret put)
DEFAULT_MODEL = "gemini-2.0-flash"
FALLBACK_MODEL = "deepseek-ai/deepseek-r1"